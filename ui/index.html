<title>Wavelength</title>
<script>/* theme before the first paint: "light", "dark", or the system's (no attribute) */
try { const t = localStorage.getItem('wl-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>

<link rel="icon" href="ui/icons/favicon-32.png" sizes="32x32" type="image/png">

<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--mono); }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 230px minmax(0, 1fr) 380px; min-height: 100vh; }
aside.songs { border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow: auto; }
/* the lockup: the mark at 1.35 x the name's cap height, one step from the name (the site's header) */
.brand { display: flex; align-items: center; gap: .28em; font: 700 1.2rem/1 var(--display); font-variation-settings: "wdth" 120; letter-spacing: -.01em; padding: 2px 8px 18px; }
.brand svg { color: var(--accent); height: .95em; width: auto; flex: none; }
.theme { margin-left: auto; flex: none; width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
.theme:hover { color: var(--text); border-color: var(--line); background: var(--panel-2); }
.brand a { display: flex; align-items: center; gap: .28em; color: inherit; text-decoration: none; }
.brand a:hover { color: var(--accent); }
.conn { margin-left: 6px; align-self: center; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.song { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
.song:hover { background: var(--panel-2); }
.song.sel { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
.song .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.song .t { color: var(--muted); font: 11px var(--mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: transparent; }
.dot.live { background: var(--accent); animation: pulse 1.4s infinite; }
.dot.done { background: var(--ok); opacity: .7; }
@keyframes pulse { 50% { opacity: .3; } }
.follow { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; padding: 12px 8px 0; }
main { padding: 20px 22px 40px; min-width: 0; }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 800 30px/1.05 var(--display); font-variation-settings: "wdth" 112; letter-spacing: -.01em; overflow-wrap: anywhere; }
.byline { color: var(--muted); font-size: 13px; margin-top: 4px; min-height: 1em; }
.byline b { color: var(--text); font-weight: 600; }
.renderbar { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.renderbar .ed-open { margin-left: 0; }
.renderbar .err { color: #e5484d; }
.head .ed-open { margin-left: 0; align-self: center; }
canvas#tl.labels { cursor: default; }
.status { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.status.rendering { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.status.writing { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 40%, transparent); }
.status.done { color: var(--ok); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px 6px; }
.chip b { display: block; font: 700 19px/1.15 var(--display); font-variation-settings: "wdth" 105; }
.chip span { color: var(--muted); font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
.card h2 { margin: 0; font: 700 16px/1.2 var(--display); font-variation-settings: "wdth" 110; color: var(--text); padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.card h2 .r { margin-left: auto; font: 400 11.5px var(--mono); color: var(--muted); }
.transport { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--button); color: var(--on-button); cursor: pointer; display: grid; place-items: center; }
.play:hover:not(:disabled) { background: var(--button-hover); }
.play:disabled { opacity: .35; cursor: default; }
select { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 260px; }
.solo { font-size: 12px; color: var(--accent); }
.tl-wrap { position: relative; }
canvas#tl { display: block; width: 100%; cursor: crosshair; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.bars { padding: 10px 14px 14px; }
.bar { display: grid; grid-template-columns: 110px 1fr 54px; gap: 8px; align-items: center; font-size: 12px; padding: 2px 0; }
.bar .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track, .bar .fill { display: block; }
.bar .track { height: 10px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 3px; }
.bar .v { text-align: right; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.side { border-left: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; }
.side h2 { margin: 0; font: 700 16px/1.2 var(--display); font-variation-settings: "wdth" 110; color: var(--text); padding: 16px 14px 10px; display: flex; align-items: baseline; }
.side h2 .r { margin-left: auto; font: 400 11px var(--mono); color: var(--muted); }
.feed { flex: 1; overflow: auto; padding: 0 14px 10px; min-height: 0; }
.it { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.it .k { font-size: 11px; color: var(--muted); display: flex; gap: 6px; }
.it .k .tool { color: var(--accent-2); font-weight: 600; }
.it pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.4 var(--mono); color: var(--muted); max-height: 90px; overflow: hidden; }
.it.text p { margin: 3px 0 0; white-space: pre-wrap; }
.files { height: 30vh; overflow: auto; border-top: 1px solid var(--line); padding: 0 14px 10px; font: 12px/1.6 var(--mono); }
.fe { display: flex; gap: 8px; white-space: nowrap; }
.fe .p { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.fe .a { color: var(--ok); } .fe .c { color: var(--accent-2); } .fe .x { color: var(--accent); }
.fe .w { color: var(--muted); }
.empty { color: var(--muted); padding: 14px; font-size: 13px; }
.docs pre { margin: 0; padding: 14px; white-space: pre-wrap; font: 12.5px/1.5 var(--mono); max-height: 360px; overflow: auto; }
.warns { padding: 8px 14px; font-size: 12px; color: var(--warn); border-top: 1px solid var(--line); }
@media (max-width: 1200px) { .app { grid-template-columns: 200px minmax(0, 1fr); } .side { grid-column: 1 / -1; height: auto; position: static; border-left: 0; border-top: 1px solid var(--line); } .feed { max-height: 60vh; } }
@media (max-width: 760px) { .card h2 .ed-open + .r { display: none; } .app { grid-template-columns: 1fr; } aside.songs { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; } main { padding: 16px; } .grid2 { grid-template-columns: 1fr; } }
</style>

<body>
<div class="app">
	<aside class="songs">
		<div class="brand">
			<a href="./" id="home-link" title="Overview"><svg viewBox="0 3 24 18" role="img" aria-label="Wavelength"><path d="M0 12 H2 V4.25 H6 V19.75 H10 V10 H14 V19.75 H18 V4.25 H22 V12 H24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="butt"/></svg>Wavelength</a>
			<button class="theme" id="theme" title="Light or dark (right-click: system)" aria-label="Colour theme"></button>
			<span class="conn" id="conn" title="event stream"></span>
		</div>
		<nav class="nav" id="nav">
			<a href="./" data-view="home"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Overview</a>
			<a href="?view=playground" data-view="play"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M7 5v9M12 5v9M17 5v9"/></svg>Playground</a>
		</nav>
		<div class="nav-h">Songs</div>
		<div id="songs"></div>
		<label class="follow"><input type="checkbox" id="follow" checked> Follow the newest song</label>
	</aside>

	<main id="homeview" class="page" hidden></main>
	<main id="playview" class="page" hidden></main>
	<main id="songview">
		<div class="head"><h1 id="title">...</h1><span class="status" id="status"></span>
			<button class="ed-open" id="detailsbtn" title="Title, folder name, authors (right-click a song for more)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Details</button></div>
		<div class="byline" id="byline"></div>
		<div class="renderbar"><button class="ed-open" id="renderbtn" title="Render the whole song again (job.json with any edits.json) into its out folder">Render</button><span id="renderinfo"></span><button class="wl-cancel" id="rendercancel" hidden>Cancel render</button></div>
		<div class="chips" id="chips"></div>

		<section class="card">
			<h2>Arrangement <button class="ed-open" id="ed-openbtn" title="Open the arrangement editor (E)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg>Open editor <span class="badge" id="ed-badge" hidden></span></button><span class="r mono" id="tlinfo"></span></h2>
			<div class="transport">
				<button class="play" id="play" disabled aria-label="Play"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" id="playicon"><path d="M6 4l14 8-14 8z"/></svg></button>
				<span class="mono" id="time">0:00 / 0:00</span>
				<select id="audiosel"></select>
				<span class="solo" id="solo"></span>
				<button class="wl-cancel" id="cancel" hidden title="Stop this render">Cancel render</button>
			</div>
			<div class="tl-wrap"><canvas id="tl"></canvas></div>
			<div class="warns" id="warns" hidden></div>
		</section>

		<div class="grid2">
			<section class="card"><h2>Sections <span class="r">integrated LUFS</span></h2><div class="bars" id="sections"></div></section>
			<section class="card"><h2>Tracks <span class="r">stem LUFS</span></h2><div class="bars" id="tracks"></div></section>
		</div>

		<section class="card docs" id="docs" hidden></section>

	<aside class="side">
		<h2>Agent <span class="r mono" id="agentinfo"></span></h2>
		<div class="feed" id="feed"><div class="empty">Looking for a Claude session working in this folder...</div></div>
		<h2>Files</h2>
		<div class="files" id="files"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = { slug: null, song: null, songs: [], files: {}, fileLog: [], soloIdx: -1, flash: {}, src: null };
const audio = new Audio();
audio.preload = 'metadata';

function ago(ts) {
	const s = Math.max(0, Date.now() / 1000 - ts);
	if (s < 60) return Math.round(s) + 's';
	if (s < 3600) return Math.round(s / 60) + 'm';
	if (s < 86400) return Math.round(s / 3600) + 'h';
	return Math.round(s / 86400) + 'd';
}
const fmtTime = t => !isFinite(t) ? '0:00' : Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const fmtSize = b => b >= 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b >= 1e3 ? Math.round(b / 1e3) + ' KB' : b + ' B';
// Audio goes through the songs/ symlink so Caddy serves it (native ranges, no PHP thread held).
const fileUrl = p => ['songs', state.slug, ...p.split('/')].map(encodeURIComponent).join('/');

/* ---------- tempo map: beats -> seconds ---------- */
function tempoFn(tempo) {
	const pts = Array.isArray(tempo) ? tempo.map(p => ({ beat: +p.beat || 0, bpm: +p.bpm || 120, ramp: !!p.ramp })).sort((a, b) => a.beat - b.beat) : [{ beat: 0, bpm: +tempo || 120 }];
	if (pts[0].beat > 0) pts.unshift({ beat: 0, bpm: pts[0].bpm });
	// seconds elapsed at each point, and the segment rule for integrating past it
	const segSec = (a, b, from, to) => {
		if (!b || !b.ramp) return (to - from) * 60 / a.bpm;
		const k = (b.bpm - a.bpm) / (b.beat - a.beat), bpmAt = x => a.bpm + k * (x - a.beat);
		return Math.abs(k) < 1e-9 ? (to - from) * 60 / a.bpm : 60 / k * Math.log(bpmAt(to) / bpmAt(from));
	};
	const at = [0];
	for (let i = 1; i < pts.length; i++) at[i] = at[i - 1] + segSec(pts[i - 1], pts[i], pts[i - 1].beat, pts[i].beat);
	return beat => {
		let i = 0;
		while (i + 1 < pts.length && pts[i + 1].beat <= beat) i++;
		const next = pts[i + 1];
		if (next && next.ramp) return at[i] + segSec(pts[i], next, pts[i].beat, beat);
		return at[i] + (beat - pts[i].beat) * 60 / pts[i].bpm;
	};
}

/* ---------- data ---------- */
async function loadSongs() {
	const r = await fetch('api/songs').then(r => r.json());
	setSongs(r.songs);
}
function setSongs(list) {
	state.songs = list;
	if (state.view !== 'song') { renderSongList(); if (state.view === 'home') renderHome(); return; }
	if ($('#follow').checked && list[0] && list[0].slug !== state.slug && Date.now() / 1000 - list[0].mtime < 600) selectSong(list[0].slug);
	if (!state.slug && list[0]) selectSong(list[0].slug);
	else if (state.slug && !state.renaming && !list.some(s => s.slug === state.slug) && list[0]) selectSong(list[0].slug);
	renderSongList();
}
function renderSongList() {
	$('#songs').innerHTML = state.songs.map(s => {
		const live = Date.now() / 1000 - s.mtime < 120;
		return `<button class="song ${s.slug === state.slug && state.view === 'song' ? 'sel' : ''}" data-slug="${esc(s.slug)}">
			<span class="dot ${live ? 'live' : s.mp3 ? 'done' : ''}"></span><span class="n" title="${esc(s.slug)}">${esc(s.title || s.slug)}</span><span class="t">${ago(s.mtime)}</span></button>`;
	}).join('');
}
$('#songs').addEventListener('click', e => {
	const b = e.target.closest('.song');
	if (!b) return;
	$('#follow').checked = b.dataset.slug === state.songs[0]?.slug;
	selectSong(b.dataset.slug, true);
});

function selectSong(slug, push) {
	const fromOther = state.view !== 'song';
	showView('song');
	if (fromOther || push) history.pushState(null, '', '?song=' + encodeURIComponent(slug));
	if (slug === state.slug) { document.title = (state.song?.meta?.title || slug) + ' · Wavelength'; return; }
	state.rendering = null; $('#renderinfo').textContent = '';
	state.slug = slug; state.song = null; state.fileLog = []; state.soloIdx = -1; state.soloKind = null; state.pending = null; state.preview = null; state.src = null; state.srcWindow = null; state.srcStart = 0; state.srcLead = null; state.flash = {};
	window.WLEditor?.reset();
	audio.pause(); audio.removeAttribute('src');
	if (!fromOther && !push) history.replaceState(null, '', '?song=' + encodeURIComponent(slug));
	document.title = slug + ' · Wavelength';
	$('#feed').innerHTML = '<div class="empty">Looking for a Claude session working in this folder...</div>';
	renderSongList();
	loadSong(); loadAgent(); connect();
}

async function loadSong() {
	const slug = state.slug;
	const d = await fetch('api/song?song=' + encodeURIComponent(slug)).then(r => r.json());
	if (slug !== state.slug) return;
	state.song = d; state.files = d.files || {};
	if (!state.fileLog.length) {
		state.fileLog = Object.entries(state.files).sort((a, b) => a[1][1] - b[1][1]).slice(-40)
			.map(([p, f]) => ({ type: 'seen', path: p, size: f[0], at: f[1] * 1000 }));
		renderFiles();
	}
	prepareTimeline(); renderAll(); setAudioChoices();
	window.WLEditor?.refresh();
}

let agentTimer = 0;
async function loadAgent() {
	const slug = state.slug;
	const d = await fetch('api/agent?song=' + encodeURIComponent(slug)).then(r => r.json());
	if (slug !== state.slug) return;
	const feed = $('#feed');
	const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
	$('#agentinfo').textContent = d.session ? d.session.slice(0, 8) + ' · ' + ago(d.mtime) + ' ago' : '';
	if (!d.items.length) { feed.innerHTML = '<div class="empty">No Claude session is working in this folder right now.</div>'; return; }
	feed.innerHTML = d.items.map(i => {
		const when = i.at ? new Date(i.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
		if (i.kind === 'text') return `<div class="it text"><div class="k">${when}</div><p>${esc(i.text)}</p></div>`;
		return `<div class="it"><div class="k"><span class="tool">${esc(i.tool)}</span> ${when}</div><div>${esc(i.text)}</div>${i.code && i.code !== i.text ? `<pre>${esc(i.code)}</pre>` : ''}</div>`;
	}).join('');
	if (atBottom) feed.scrollTop = feed.scrollHeight;
}

/* ---------- live stream ---------- */
let es = null, songTimer = 0;
function connect() {
	if (es) es.close();
	es = new EventSource('api/events?song=' + encodeURIComponent(state.slug || ''));
	es.onopen = () => $('#conn').classList.add('on');
	es.onerror = () => $('#conn').classList.remove('on');
	es.addEventListener('songs', e => setSongs(JSON.parse(e.data)));
	es.addEventListener('previews', e => renderState(JSON.parse(e.data)));
	es.addEventListener('agent', () => { clearTimeout(agentTimer); agentTimer = setTimeout(loadAgent, 400); });
	es.addEventListener('files', e => {
		const changes = JSON.parse(e.data);
		let reload = false;
		for (const c of changes) {
			if (c.type === 'removed') delete state.files[c.path];
			else state.files[c.path] = [c.size, Date.now() / 1000];
			const last = state.fileLog[state.fileLog.length - 1];
			if (last && last.path === c.path && c.type === 'changed' && last.type !== 'seen') { last.size = c.size; last.at = Date.now(); last.n = (last.n || 1) + 1; }
			else state.fileLog.push({ ...c, at: Date.now() });
			if (/(^|\/)(job|report)\.json$|\.(mp3|md)$|\.json$/.test(c.path) && !/stems\/|solo\/|preview\//.test(c.path)) reload = true;
			const m = c.path.match(/stems\/(\d+)-/);
			if (m) state.flash[+m[1] - 1] = Date.now();
		}
		state.fileLog = state.fileLog.slice(-300);
		renderFiles(); renderStatus();
		if (reload) { clearTimeout(songTimer); songTimer = setTimeout(loadSong, 700); }
	});
}

function renderFiles() {
	const el = $('#files');
	const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
	el.innerHTML = state.fileLog.map(f => {
		const cls = { added: 'a', changed: 'c', removed: 'x', seen: 'w' }[f.type];
		const sym = { added: '+', changed: '~', removed: '-', seen: '·' }[f.type];
		return `<div class="fe"><span class="${cls}">${sym}</span><span class="p" title="${esc(f.path)}">${esc(f.path)}${f.n > 1 ? ' ×' + f.n : ''}</span><span class="w">${f.size != null ? fmtSize(f.size) : ''}</span></div>`;
	}).join('') || '<div class="empty">Empty folder.</div>';
	if (atBottom) el.scrollTop = el.scrollHeight;
}

/* ---------- status, chips, bars ---------- */
function renderStatus() {
	const d = state.song, st = $('#status');
	if (!d) return;
	const now = Date.now() / 1000, rep = d.reportPath && state.files[d.reportPath];
	const outDir = d.reportPath ? d.reportPath.replace(/report\.json$/, '') : 'out/';
	const stems = Object.entries(state.files).filter(([p]) => p.startsWith(outDir + 'stems/') && p.endsWith('.wav'));
	const fresh = stems.filter(([, f]) => !rep || f[1] > rep[1]);
	const busy = Object.values(state.files).some(f => now - f[1] < 6);
	const nTracks = d.job?.tracks.length || 0;
	if (fresh.length && now - Math.max(...fresh.map(([, f]) => f[1])) < 30) {
		st.className = 'status rendering'; st.textContent = `Rendering · ${fresh.length}/${nTracks} stems`;
	} else if (busy) {
		st.className = 'status writing'; st.textContent = 'Working';
	} else if (rep) {
		st.className = 'status done'; st.textContent = 'Rendered ' + ago(rep[1]) + ' ago';
	} else {
		st.className = 'status'; st.textContent = d.job ? 'Not rendered yet' : 'Planning';
	}
}

function renderAll() {
	const d = state.song, job = d.job, rep = d.report;
	$('#title').textContent = d.meta?.title || d.slug;
	$('#title').title = 'folder: ' + d.slug;
	const authors = d.meta?.authors || [];
	$('#byline').innerHTML = (d.meta?.title && d.meta.title !== d.slug ? `<span class="mono">${esc(d.slug)}</span>` : '')
		+ (authors.length ? (d.meta?.title && d.meta.title !== d.slug ? ' · ' : '') + 'by ' + authors.map(a => `<b>${esc(a.name)}</b>${a.role ? ' (' + esc(a.role) + ')' : ''}`).join(', ') : '');
	renderStatus();
	const tempo = job ? (Array.isArray(job.tempo) ? job.tempo.map(p => p.bpm).join('→') : job.tempo) : null;
	const chip = (v, l) => v == null || v === '' ? '' : `<div class="chip"><b class="mono">${esc(v)}</b><span>${l}</span></div>`;
	$('#chips').innerHTML = [
		chip(tempo, 'BPM'), chip(job?.tracks.length, 'tracks'),
		chip(job?.tracks.reduce((n, t) => n + t.notes.length, 0).toLocaleString(), 'notes'),
		chip(rep ? fmtTime(rep.seconds) : null, 'length'),
		chip(rep?.mix ? rep.mix.lufs.toFixed(1) : null, 'LUFS'),
		chip(rep?.mix?.truePeakDb != null ? rep.mix.truePeakDb.toFixed(1) : null, 'true peak'),
		chip(rep ? Math.round(rep.renderSeconds) + 's' : null, 'render'),
	].join('');
	$('#tlinfo').textContent = [d.jobPath, d.reportPath].filter(Boolean).join('  ·  ');

	const lufsBars = (rows, lo = -40, hi = -6) => rows.map(r => {
		const pct = Math.max(0, Math.min(1, (r.v - lo) / (hi - lo))) * 100;
		return `<div class="bar"><span class="l" title="${esc(r.l)}">${esc(r.l)}</span><span class="track"><span class="fill" style="width:${pct}%;background:${r.c}"></span></span><span class="v mono">${r.v <= -100 ? 'silent' : r.v.toFixed(1)}</span></div>`;
	}).join('');
	$('#sections').innerHTML = rep?.sections?.length ? lufsBars(rep.sections.map(s => ({ l: s.name, v: s.lufs, c: 'var(--accent)' })))
		: '<div class="empty">No report yet.</div>';
	$('#tracks').innerHTML = rep?.tracks?.length ? lufsBars(rep.tracks.map((t, i) => ({ l: t.name, v: t.lufs, c: hue(i) })))
		: '<div class="empty">No report yet.</div>';
	const warns = [...(rep?.warnings || []), ...(rep?.tracks || []).flatMap(t => (t.warnings || []).map(w => t.name + ': ' + w))];
	$('#warns').hidden = !warns.length;
	$('#warns').innerHTML = warns.slice(0, 12).map(w => '⚠ ' + esc(w)).join('<br>');

	const docs = Object.entries(d.docs || {});
	$('#docs').hidden = !docs.length;
	$('#docs').innerHTML = docs.map(([p, t]) => `<h2>${esc(p)}</h2><pre>${esc(t)}</pre>`).join('');
	drawTimeline();
}

/* ---------- audio ---------- */
// ---- what plays ----
// Every source knows where it sits in the song: `lead` seconds of silence at the start of the file
// (the mix's lead-in), then song time from `start`. A bar preview starts mid-song with no lead-in and
// loops. The playhead, seeking and the editor all work in song seconds.
let TOKEN = document.querySelector('meta[name="wavelength-token"]')?.content || '';
function postHeaders() { return { 'Content-Type': 'application/json', 'X-Wavelength-Token': TOKEN }; }
// POST JSON and read the answer. A 403 means this page's token is stale (a server from before 0.4 made a new
// one each start): take the current one from a fresh copy of the page and try once more.
async function postJson(url, body) {
	const send = () => fetch(url, { method: 'POST', headers: postHeaders(), body: JSON.stringify(body) });
	let r = await send();
	if (r.status === 403) {
		const page = await fetch('./', { cache: 'no-store' }).then(x => x.text()).catch(() => '');
		const m = page.match(/name="wavelength-token" content="([0-9a-f]+)"/);
		if (m && m[1] !== TOKEN) { TOKEN = m[1]; r = await send(); }
	}
	const j = await r.json().catch(() => ({}));
	if (!r.ok) throw new Error(j.error || `the server answered ${r.status}`);
	return j;
}
const songLead = () => state.song?.report?.leadIn ?? state.song?.job?.leadIn ?? 0;
function songSecNow() { return window.WLLive?.active ? WLLive.songSec() : audio.currentTime - (state.srcLead ?? songLead()) + (state.srcStart || 0); }
function seekSongSec(s, play) {
	if (window.WLLive?.active) { WLLive.seek(s); return; }   // the live loop: only inside its bars
	if (state.srcWindow && (s < state.srcWindow[0] - 1e-3 || s >= state.srcWindow[1])) {   // outside the preview: back to the mix there
		backToMix(s, play ?? !audio.paused); return;
	}
	audio.currentTime = Math.max(0, Math.min(s - (state.srcStart || 0) + (state.srcLead ?? songLead()), (audio.duration || 1e9) - 0.01));
	if (play && audio.paused) audio.play();
}
function setAudioChoices() {
	const d = state.song, sel = $('#audiosel');
	const list = d.audio || [];
	const cur = state.src && state.soloIdx < 0 && !state.srcWindow ? state.src : null;
	sel.innerHTML = list.map(p => `<option value="${esc(p)}">${esc(p)} · ${ago(state.files[p]?.[1] || 0)} ago</option>`).join('') || '<option>no audio yet</option>';
	$('#play').disabled = !list.length;
	if (!list.length) return;
	if (cur && list.includes(cur)) {
		sel.value = cur;
		// the file under the playhead was re-rendered: reload it in place
		const m = state.files[cur]?.[1];
		if (m && state.srcMtime && m !== state.srcMtime && !audio.paused) setSrc(cur, songSecNow(), true);
	} else if (state.soloIdx < 0 && !state.srcWindow) setSrc(list[0], 0, false);
}
// opts: { lead: seconds of lead-in in the file (default the song's), start: song seconds at the end of
// the lead-in, loop, window: [song start, song end] of a preview, label }
function setSrc(path, songSec, play, opts = {}) {
	state.src = path; state.srcMtime = state.files[path]?.[1] || opts.mtime || Date.now();
	state.srcLead = opts.lead ?? songLead(); state.srcStart = opts.start || 0; state.srcWindow = opts.window || null;
	audio.loop = !!opts.loop;
	audio.src = fileUrl(path) + '?v=' + state.srcMtime;
	audio.addEventListener('loadedmetadata', () => {
		const t = songSec - state.srcStart + state.srcLead;
		audio.currentTime = Math.max(0, Math.min(t, (audio.duration || t) - 0.01));
		if (play) audio.play();
	}, { once: true });
	window.WLEditor?.redraw?.();
}
function backToMix(songSec, play) {
	state.soloIdx = -1; state.soloKind = null; state.pending = null; state.preview = null; $('#solo').textContent = '';
	setSrc($('#audiosel').value, songSec, play);
	drawTimeline();
}
$('#audiosel').addEventListener('change', e => { const t = songSecNow(), p = !audio.paused; state.soloIdx = -1; state.soloKind = null; state.pending = null; state.preview = null; $('#solo').textContent = ''; setSrc(e.target.value, t, p); });
$('#play').addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
audio.addEventListener('play', () => $('#playicon').innerHTML = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>');
audio.addEventListener('pause', () => $('#playicon').innerHTML = '<path d="M6 4l14 8-14 8z"/>');
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body && !document.querySelector('dialog[open]')) { e.preventDefault(); $('#play').click(); } });

function stemFor(i) {
	const d = state.song, outDir = d.reportPath ? d.reportPath.replace(/report\.json$/, '') : 'out/';
	const prefix = outDir + 'stems/' + String(i + 1).padStart(2, '0') + '-';
	return Object.keys(state.files).find(p => p.startsWith(prefix) && p.endsWith('.wav'));
}

// ---- previews: the server renders bars and tracks through the mix (render --from/--to --tracks) ----
// spec: { tracks: [names] (empty = all), from, to (bars, to exclusive; none = the whole song), label, i (solo track) }
function requestPreview(spec) {
	const slug = state.slug, pending = { ...spec, since: Date.now() };
	state.pending = pending;
	const show = r => { $('#solo').textContent = r; $('#solo').title = 'A preview plays only its bars and loops; click the timeline outside them (or pick the mix) to go back'; $('#cancel').hidden = state.pending !== pending; window.WLEditor?.redraw?.(); };
	const done = r => {
		if (state.pending !== pending || state.slug !== slug) return;
		state.pending = null; $('#cancel').hidden = true;
		const w = r.window, playing = !audio.paused;
		state.files[r.path] = [0, Date.now() / 1000];
		if (w) {   // bars: loop them, starting where the playhead is if it is inside
			const a = w.songStart, b = w.songStart + w.seconds, now = songSecNow();
			state.preview = { ...spec, window: [a, b] };
			state.soloIdx = spec.i ?? -1; state.soloKind = spec.i != null ? 'mix' : null;
			setSrc(r.path, now >= a && now < b ? now : a, true, { lead: 0, start: a, loop: true, window: [a, b] });
			show(`Preview: ${spec.label} · ${r.seconds != null ? r.seconds + ' s' : 'cached'} · loops`);
		} else {
			state.preview = null; state.soloIdx = spec.i ?? -1; state.soloKind = 'mix';
			setSrc(r.path, songSecNow(), playing || true);
			show(`Solo in the mix: ${spec.label} (click again to unsolo)`);
		}
		drawTimeline();
	};
	const poll = async id => {
		if (state.pending !== pending || state.slug !== slug) return;
		const r = await fetch('api/preview?id=' + encodeURIComponent(id)).then(r => r.json()).catch(() => ({ status: 'failed', error: 'the server did not answer' }));
		if (state.pending !== pending) return;
		if (r.status === 'ready') return done(r);
		if (r.status === 'queued' || r.status === 'rendering') {
			show(`${r.status === 'queued' ? 'Waiting to render' : 'Rendering'} ${spec.label}… ${Math.round((Date.now() - pending.since) / 1000)}s`);
			return setTimeout(() => poll(id), 700);
		}
		state.pending = null; show(r.status === 'cancelled' ? `Cancelled ${spec.label}` : `Could not render ${spec.label}: ${r.error || r.status}`);
	};
	show(`Rendering ${spec.label}…`);
	postJson('api/preview', { song: slug, tracks: spec.tracks || [], from: spec.from || 0, to: spec.to || 0 })
		.then(r => r.error ? (state.pending = null, show(`Could not render ${spec.label}: ${r.error}`)) : r.status === 'ready' ? done(r) : poll(r.id))
		.catch(e => { state.pending = null; show(`Could not render ${spec.label}: ${e.message || 'the server did not answer'}`); });
	drawTimeline();
}

// Stop the render we are waiting for (and anything else queued for this song) and stay on what plays now.
function cancelPreview() {
	const p = state.pending;
	if (!p) return;
	state.pending = null;
	$('#cancel').hidden = true;
	$('#solo').textContent = 'Cancelled ' + p.label;
	postJson('api/preview/cancel', { song: state.slug }).catch(() => {});
	drawTimeline(); window.WLEditor?.redraw?.();
}
$('#cancel').addEventListener('click', cancelPreview);

// Solo a track. "mix" (default): the track through its sends, buses and master at its level in the full
// mix (a server preview of the whole song, cached until the song changes). "dry": the stem file, the
// track right after its own effects.
function toggleSolo(i, kind = 'mix') {
	const t = songSecNow(), playing = !audio.paused, name = state.song.job.tracks[i].name;
	if (state.pending?.i === i && kind === 'mix') return cancelPreview();
	if (state.soloIdx === i && state.soloKind === kind && !state.preview) return backToMix(t, playing);
	if (kind === 'dry') {
		if (!stemFor(i)) return;
		state.pending = null; state.preview = null; state.soloIdx = i; state.soloKind = 'dry';
		$('#solo').textContent = 'Dry stem: ' + name + ' (before its fader, sends and the master)';
		setSrc(stemFor(i), t, playing); drawTimeline(); return;
	}
	requestPreview({ tracks: [name], label: name, i });
}

/* ---------- timeline ---------- */
const LABEL = 170, ROW = 30, TOP = 26;
// lane colours: the site's song-player palette (golden-angle hues from cobalt), toned for the theme
let laneTone = null;
const hue = i => {
	if (!laneTone) { const s = getComputedStyle(document.documentElement); laneTone = [s.getPropertyValue('--lane-sat').trim() || '70%', s.getPropertyValue('--lane-light').trim() || '60%']; }
	return `hsl(${(i * 137.5 + 220) % 360} ${laneTone[0]} ${laneTone[1]})`;
};
const FONT = '"Instrument Sans", system-ui, sans-serif', MONO = '"JetBrains Mono", ui-monospace, monospace';
let tl = null;
function prepareTimeline() {
	const job = state.song.job;
	if (!job) { tl = null; return; }
	const toSec = tempoFn(job.tempo);
	const tracks = job.tracks.map(t => {
		const notes = t.notes.map(n => {
			const s = n[4] ? n[0] : toSec(n[0]);
			const e = n[4] ? n[0] + n[1] : toSec(n[0] + n[1]);
			return [s, e, n[2], n[3]];
		});
		const keys = notes.map(n => n[2]);
		return { ...t, secs: notes, lo: Math.min(...keys, 127), hi: Math.max(...keys, 0) };
	});
	const end = Math.max(1, ...tracks.flatMap(t => t.secs.map(n => n[1])), state.song.report ? state.song.report.seconds - (state.song.report.leadIn || 0) : 0);
	const markers = (job.markers || []).map(m => ({ name: m.name, t: toSec(+m.beat || 0) }));
	tl = { tracks, end, markers, leadIn: state.song.report?.leadIn ?? job.leadIn ?? 0 };
}

function drawTimeline() {
	if (!state.song) return;
	const c = $('#tl'), css = getComputedStyle(document.documentElement);
	const v = n => css.getPropertyValue(n).trim();
	const w = c.parentElement.clientWidth, n = tl ? tl.tracks.length : 0;
	const h = tl ? TOP + n * ROW + 8 : 120, dpr = devicePixelRatio || 1;
	if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px'; }
	const g = c.getContext('2d');
	g.setTransform(dpr, 0, 0, dpr, 0, 0);
	g.clearRect(0, 0, w, h);
	g.font = '12px ' + FONT;
	if (!tl) { g.fillStyle = v('--muted'); g.fillText('No job.json yet. The agent is still planning.', 14, 60); return; }
	const label = w < 600 ? 100 : LABEL, span = w - label - 10, X = t => label + (t / tl.end) * span;
	const rep = state.song.report;

	// sections
	tl.markers.forEach((m, i) => {
		const x0 = X(m.t), x1 = X(tl.markers[i + 1]?.t ?? tl.end);
		if (i % 2 === 0) { g.fillStyle = v('--section'); g.fillRect(x0, 0, x1 - x0, h); }
		g.fillStyle = v('--grid'); g.fillRect(x0, 0, 1, h);
		g.fillStyle = v('--muted'); g.save(); g.beginPath(); g.rect(x0, 0, x1 - x0, TOP); g.clip();
		if (g.measureText(m.name || '').width < x1 - x0 - 8) g.fillText(m.name || '', x0 + 5, 17);
		g.restore();
	});

	const now = Date.now();
	tl.tracks.forEach((t, i) => {
		const y = TOP + i * ROW;
		if (i % 2) { g.fillStyle = v('--lane'); g.fillRect(0, y, w, ROW); }
		const flashing = now - (state.flash[i] || 0) < 1500;
		const col = hue(i);
		g.fillStyle = flashing ? col : v('--text');
		g.font = '500 12px ' + FONT;
		g.save(); g.beginPath(); g.rect(0, y, label - 8, ROW); g.clip();
		g.fillText((t.mute ? '(m) ' : '') + t.name, 12, y + 13);
		g.fillStyle = v('--muted'); g.font = '10.5px ' + FONT;
		g.fillText(t.preset ? String(t.preset).split('/').pop().replace(/\.(vstpreset|clap-preset|state|fxb|fxp|vital|json)$/i, '').replace(/--.*$/, '') : t.plugin, 12, y + 25);
		g.restore();
		if (stemFor(i)) { g.fillStyle = flashing ? v('--accent') : v('--ok'); g.beginPath(); g.arc(5, y + ROW / 2, 2.5, 0, 7); g.fill(); }
		// notes, scaled to this track's key range
		const range = Math.max(12, t.hi - t.lo), pad = 4, ih = ROW - pad * 2;
		g.globalAlpha = t.mute ? .35 : 1;
		for (const [s, e, key, vel] of t.secs) {
			const x = X(s), nw = Math.max(1.5, X(e) - x - .5);
			const ny = y + pad + ih - ((key - t.lo + (range - (t.hi - t.lo)) / 2) / range) * (ih - 3) - 3;
			g.fillStyle = col; g.globalAlpha = (t.mute ? .35 : 1) * (.35 + .65 * Math.min(1, vel));
			g.fillRect(x, ny, nw, 3);
		}
		g.globalAlpha = 1;
		g.fillStyle = v('--grid'); g.fillRect(label, y + ROW - 1, span, 1);
	});

	// playhead
	if (audio.src && audio.duration) {
		const x = X(songSecNow());
		g.fillStyle = v('--play'); g.fillRect(x - .5, 0, 2, h);
	}
	$('#time').textContent = fmtTime(Math.max(0, songSecNow())) + ' / ' + fmtTime(tl.end) + (state.srcWindow ? ' · preview' : '');
}

$('#tl').addEventListener('click', e => {
	if (!tl) return;
	const r = e.target.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
	const label = r.width < 600 ? 100 : LABEL;
	if (x < label) return;   // soloing lives in the editor
	if (!audio.src) return;
	const t = (x - label) / (r.width - label - 10) * tl.end;
	seekSongSec(Math.max(0, t));
	if (audio.paused) audio.play();
});

// the arrangement editor: button, E key, or double-click the timeline to open it at that spot
$('#ed-openbtn').addEventListener('click', () => WLEditor.open());
$('#tl').addEventListener('dblclick', e => {
	if (!tl) return;
	const r = e.target.getBoundingClientRect(), x = e.clientX - r.left, label = r.width < 600 ? 100 : LABEL;
	const sec = Math.max(0, (x - label) / (r.width - label - 10) * tl.end);
	const job = state.song.job, toSec = tempoFn(job.tempo);
	let lo = 0, hi = 1; while (toSec(hi) < sec) hi *= 2; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; toSec(m) < sec ? lo = m : hi = m; }
	WLEditor.open(lo);
});
document.addEventListener('keydown', e => { if ((e.key === 'e' || e.key === 'E') && e.target === document.body && !document.querySelector('dialog[open]')) WLEditor.open(); });

/* ---------- the Render button: a full render on the server, followed through the event stream ---------- */
function renderState(list) {
	const cur = list.filter(p => p.full).sort((a, b) => (b.id > a.id) - (a.id > b.id));
	const live = cur.find(p => p.status === 'queued' || p.status === 'rendering');
	const was = state.rendering;
	if (live) live.since = was?.id === live.id && was.since ? was.since : Date.now() - (live.seconds || 0) * 1000;
	state.rendering = live || null;
	const info = $('#renderinfo');
	if (live) info.textContent = live.status === 'queued' ? 'Waiting to render…' : `Rendering the song… ${Math.round((Date.now() - live.since) / 1000)}s`;
	else if (was) {
		const end = cur.find(p => p.id === was.id);
		info.innerHTML = end?.status === 'ready' ? `Rendered in ${end.seconds}s.` : end?.status === 'cancelled' ? 'Render cancelled.' : `<span class="err">Render failed: ${esc(end?.error || 'unknown')}</span>`;
		if (end?.status === 'ready') { clearTimeout(songTimer); songTimer = setTimeout(loadSong, 300); }
	}
	$('#renderbtn').disabled = !!live;
	$('#rendercancel').hidden = !live;
	window.WLEditor?.redraw?.();
}
async function startRender() {
	try { const r = await postJson('api/render', { song: state.slug }); renderState([r]); }
	catch (e) { $('#renderinfo').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
function cancelRender() { if (state.rendering) postJson('api/preview/cancel', { id: state.rendering.id }).catch(() => {}); }
$('#renderbtn').addEventListener('click', startRender);
setInterval(() => { const r = state.rendering; if (r && r.status === 'rendering') { r.seconds = Math.round((Date.now() - r.since) / 1000); $('#renderinfo').textContent = `Rendering the song… ${r.seconds}s`; } }, 1000);
$('#rendercancel').addEventListener('click', cancelRender);

/* ---------- views: overview, playground, a song ---------- */
state.view = 'boot';   // routing decides (route() after the song list loads)
function showView(v) {
	state.view = v;
	$('#songview').hidden = v !== 'song';
	$('#homeview').hidden = v !== 'home';
	$('#playview').hidden = v !== 'play';
	document.querySelector('aside.side').hidden = v !== 'song';
	document.querySelector('.app').classList.toggle('wide', v !== 'song');
	document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('sel', a.dataset.view === v));
	if (v !== 'song') { audio.pause(); document.querySelector('dialog.ed[open]')?.close(); }
	if (v === 'home') { renderHome(); document.title = 'Wavelength'; }
	if (v === 'play') WLPlay.show(); else WLPlay.hide();
	if (!es && v !== 'song') connect();   // the song list stays live everywhere
	renderSongList();
}
function go(v) {
	history.pushState(null, '', v === 'home' ? './' : '?view=playground');
	showView(v);
}
$('#nav').addEventListener('click', e => { const a = e.target.closest('a[data-view]'); if (!a || e.metaKey || e.ctrlKey) return; e.preventDefault(); go(a.dataset.view); });
$('#home-link').addEventListener('click', e => { if (e.metaKey || e.ctrlKey) return; e.preventDefault(); go('home'); });
function route() {
	const q = new URLSearchParams(location.search);
	if (q.get('song')) { $('#follow').checked = false; selectSong(q.get('song')); }
	else showView(q.get('view') === 'playground' ? 'play' : 'home');
}
addEventListener('popstate', route);

const ICON_WAVE = '<svg viewBox="0 3 24 18"><path d="M0 12 H2 V4.25 H6 V19.75 H10 V10 H14 V19.75 H18 V4.25 H22 V12 H24" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>';
let instrumentCount = null;
function renderHome() {
	const list = state.songs, newest = list[0], ver = document.querySelector('meta[name="wavelength-version"]')?.content;
	if (instrumentCount == null) { instrumentCount = 0; fetch('api/instruments').then(r => r.json()).then(r => { instrumentCount = new Set((r.instruments || []).map(i => i.name.toLowerCase())).size; if (state.view === 'home') renderHome(); }).catch(() => {}); }
	const by = a => (a || []).map(x => x.name).join(', ');
	$('#homeview').innerHTML = `
		<div class="hero"><h1>${ICON_WAVE}Wavelength</h1>
			<p>Music rendered through real synthesizers and samplers, written by agents. Listen to the songs, pin comments to the bars you want changed, edit notes, or play any installed instrument.</p>
			${ver ? `<div class="ver">engine ${esc(ver)} · ${list.length} song${list.length === 1 ? '' : 's'}</div>` : ''}</div>
		<div class="tiles">
			<a class="tile" href="${newest ? '?song=' + encodeURIComponent(newest.slug) : './'}" data-open="${esc(newest?.slug || '')}">
				<h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Songs <b>${list.length}</b></h2>
				<p>Each song's arrangement, loudness, stems and renders, the agent's work as it happens, and an editor for comments and note edits.</p>
				<div class="go">${newest ? 'Open the newest: ' + esc(newest.title || newest.slug) + ' →' : 'No songs yet'}</div></a>
			<a class="tile" href="?view=playground" data-play>
				<h2><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M7 5v9M12 5v9M17 5v9"/></svg>Playground ${instrumentCount ? `<b>${instrumentCount}</b>` : ''}</h2>
				<p>Pick any installed instrument and preset (or a track from a song) and play it from the on-screen piano or your computer keyboard.</p>
				<div class="go">Start playing →</div></a>
		</div>
		<h2 class="sect-h">Songs <span>newest first</span></h2>
		<div class="songgrid">${list.map(s => `<button class="scard" data-open="${esc(s.slug)}">
			<span class="t">${esc(s.title || s.slug)}</span><span class="s">${esc(s.slug)}</span>
			${s.authors?.length ? `<span class="by">by ${esc(by(s.authors))}</span>` : ''}
			<span class="m">${s.seconds ? `<span><b>${fmtTime(s.seconds - 0)}</b></span>` : ''}${s.lufs != null ? `<span><b>${(+s.lufs).toFixed(1)}</b> LUFS</span>` : ''}${s.tracks ? `<span><b>${s.tracks}</b> tracks</span>` : ''}<span>${ago(s.mtime)} ago</span></span></button>`).join('') || '<div class="empty">No songs in this folder yet.</div>'}</div>`;
}
$('#homeview').addEventListener('click', e => {
	const o = e.target.closest('[data-open]'), pl = e.target.closest('[data-play]');
	if (e.metaKey || e.ctrlKey) return;
	if (pl) { e.preventDefault(); go('play'); }
	else if (o && o.dataset.open) { e.preventDefault(); $('#follow').checked = false; selectSong(o.dataset.open, true); }
});
$('#homeview').addEventListener('contextmenu', e => { const o = e.target.closest('.scard'); if (o) songMenu(e, o.dataset.open); });

/* ---------- theme: light, dark, or the system's (the default) ---------- */
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
const themePref = () => { try { return localStorage.getItem('wl-theme') || 'system'; } catch { return 'system'; } };
const themeNow = () => { const p = themePref(); return p === 'system' ? (darkQuery.matches ? 'dark' : 'light') : p; };
function setTheme(p) {
	try { p === 'system' ? localStorage.removeItem('wl-theme') : localStorage.setItem('wl-theme', p); } catch {}
	if (p === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = p;
	themeIcon(); repaint();
}
function themeIcon() {
	const dark = themeNow() === 'dark', pref = themePref();
	$('#theme').innerHTML = dark
		? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
		: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
	$('#theme').title = `${dark ? 'Dark' : 'Light'}${pref === 'system' ? ' (following the system)' : ''}: click for ${dark ? 'light' : 'dark'}, right-click for more`;
}
$('#theme').addEventListener('click', () => setTheme(themeNow() === 'dark' ? 'light' : 'dark'));
$('#theme').addEventListener('contextmenu', e => {
	const p = themePref();
	WLUI.menu(e, [
		{ label: 'Light', checked: p === 'light', run: () => setTheme('light') },
		{ label: 'Dark', checked: p === 'dark', run: () => setTheme('dark') },
		{ label: 'System', hint: darkQuery.matches ? 'dark now' : 'light now', checked: p === 'system', run: () => setTheme('system') },
	]);
});
darkQuery.addEventListener('change', themeIcon);
themeIcon();

/* ---------- song folder actions ---------- */
const SLUG_RULE = 'lowercase letters, digits and single dashes (the song format\'s slug)';
const slugError = (v, cur) => !v ? 'Give it a name.' : !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(v) ? 'Use ' + SLUG_RULE + '.'
	: v !== cur && state.songs.some(s => s.slug === v) ? 'There is already a song folder named ' + v + '.' : '';
const toSlug = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
async function renameFolder(slug, to) {
	state.renaming = true;
	try {
		const r = await postJson('api/song/rename', { song: slug, to });
		if (state.slug === slug) { state.slug = null; selectSong(r.song); }
		await loadSongs();
		return r.song;
	} finally { state.renaming = false; }
}
async function renameSong(slug) {
	const to = await WLUI.prompt({ title: 'Rename song folder', label: 'Folder name', value: slug, ok: 'Rename',
		body: `The folder in your songs directory. ${SLUG_RULE[0].toUpperCase() + SLUG_RULE.slice(1)}; the title can be anything (Details).`,
		check: v => slugError(v, slug) });
	if (!to || to === slug) return;
	try { await renameFolder(slug, to); } catch (e) { WLUI.confirm({ title: 'Could not rename', body: WLUI.esc(e.message), ok: 'OK' }); }
}
async function trashSong(slug) {
	const use = await fetch('api/song/usage?song=' + encodeURIComponent(slug)).then(r => r.json()).catch(() => ({}));
	const size = use.bytes != null ? ` <b>${fmtSize(use.bytes)}</b> in ${use.files.toLocaleString()} file${use.files === 1 ? '' : 's'}` : '';
	const ok = await WLUI.confirm({ title: 'Move to Trash?', danger: true, ok: use.bytes != null ? `Move ${fmtSize(use.bytes)} to Trash` : 'Move to Trash',
		body: `The whole folder <code>${WLUI.esc(slug)}</code>${size} (job, renders, stems, notes, history) goes to the Trash. To restore it, drag it from the Trash back into your songs folder.` });
	if (!ok) return;
	try {
		await postJson('api/song/trash', { song: slug });
		if (state.slug === slug) { audio.pause(); state.slug = null; }
		state.songs = state.songs.filter(s => s.slug !== slug);
		await loadSongs();
	} catch (e) { WLUI.confirm({ title: 'Could not move it to the Trash', body: WLUI.esc(e.message), ok: 'OK' }); }
}
const reveal = (slug, file) => postJson('api/song/reveal', { song: slug, file: file || '' }).catch(e => WLUI.confirm({ title: 'Could not show it', body: WLUI.esc(e.message), ok: 'OK' }));
async function editDetails(slug) {
	const m = await fetch('api/meta?song=' + encodeURIComponent(slug)).then(r => r.json());
	if (m.error) return;
	const authorRow = (a = {}) => `<div class="wl-author"><input name="an" placeholder="Name" value="${esc(a.name || '')}"><input name="ar" placeholder="Role (producer, composer…)" value="${esc(a.role || '')}">
		<select name="ak"><option value="human">Person</option><option value="ai" ${a.kind === 'ai' ? 'selected' : ''}>AI</option></select><button type="button" data-del title="Remove">✕</button></div>`;
	const body = `
		${m.manifest ? '' : '<p>This folder has no <code>wavelength.json</code> yet; saving writes one (the song format\'s manifest).</p>'}
		<label class="wl-field"><span>Title</span><input name="title" value="${esc(m.title || '')}" required></label>
		<label class="wl-field"><span>Folder name</span><input name="slug" class="mono" value="${esc(slug)}" spellcheck="false"><small>${SLUG_RULE}</small></label>
		<div class="wl-field"><span>Authors</span><div class="wl-authors">${(m.authors.length ? m.authors : [{}]).map(authorRow).join('')}</div><button type="button" class="wl-add">+ Add author</button></div>
		<label class="wl-field"><span>Summary</span><input name="summary" value="${esc(m.summary || '')}" placeholder="One sentence"></label>
		<label class="wl-field"><span>Tags</span><input name="tags" value="${esc((m.tags || []).join(', '))}" placeholder="synthwave, 80s"></label>
		<label class="wl-field"><span>License</span><input name="license" value="${esc(m.license || '')}" placeholder="CC-BY-4.0 (empty = all rights reserved)"></label>`;
	await WLUI.modal({ title: 'Song details', body, cls: 'wide', buttons: [{ value: 'cancel', label: 'Cancel' }, { value: 'ok', label: 'Save', cls: 'primary', submit: async api => {
		const f = api.dlg, val = n => f.querySelector(`[name="${n}"]`).value.trim();
		const to = val('slug'), err = slugError(to, slug);
		if (err) return api.error(err);
		if (!val('title')) return api.error('A song needs a title.');
		const authors = [...f.querySelectorAll('.wl-author')].map(r => ({ name: r.querySelector('[name=an]').value.trim(), role: r.querySelector('[name=ar]').value.trim(), kind: r.querySelector('[name=ak]').value })).filter(a => a.name);
		api.busy(true);
		try {
			let cur = slug;
			if (to !== slug) cur = await renameFolder(slug, to);
			await postJson('api/meta', { song: cur, title: val('title'), authors, summary: val('summary'), license: val('license'), tags: val('tags').split(',').map(t => t.trim()).filter(Boolean) });
			if (state.slug === cur) loadSong();
			api.done('ok');
		} catch (e) { api.busy(false); api.error(e.message); }
	} }], init: api => {
		const d = api.dlg, list = d.querySelector('.wl-authors');
		d.querySelector('.wl-add').addEventListener('click', () => { list.insertAdjacentHTML('beforeend', authorRow()); list.lastElementChild.querySelector('input').focus(); });
		list.addEventListener('click', e => { if (e.target.closest('[data-del]')) e.target.closest('.wl-author').remove(); });
		const title = d.querySelector('[name=title]'), sl = d.querySelector('[name=slug]');
		let follow = toSlug(title.value) === slug;   // the folder name follows the title until you edit it
		title.addEventListener('input', () => { if (follow) sl.value = toSlug(title.value); });
		sl.addEventListener('input', () => { follow = false; });
		title.focus();
	} });
}
$('#detailsbtn').addEventListener('click', () => state.slug && editDetails(state.slug));

/* ---------- right-click menus ---------- */
$('#songs').addEventListener('contextmenu', e => {
	const b = e.target.closest('.song');
	if (b) songMenu(e, b.dataset.slug);
});
function songMenu(e, slug) {
	WLUI.menu(e, [
		{ label: 'Open', run: () => { $('#follow').checked = false; selectSong(slug, true); } },
		{ label: 'Open in the editor', hint: 'E', run: () => { $('#follow').checked = false; selectSong(slug, true); const wait = setInterval(() => { if (state.song?.slug === slug) { clearInterval(wait); WLEditor.open(); } }, 100); setTimeout(() => clearInterval(wait), 8000); } },
		'-',
		{ label: 'Edit details…', run: () => editDetails(slug) },
		{ label: 'Rename folder…', run: () => renameSong(slug) },
		{ label: 'Show in Finder', run: () => reveal(slug) },
		{ label: 'Copy folder name', run: () => navigator.clipboard?.writeText(slug) },
		'-',
		{ label: 'Move to Trash…', danger: true, run: () => trashSong(slug) },
	]);
}
$('#tl').addEventListener('contextmenu', e => {
	if (!tl) return;
	const r = e.target.getBoundingClientRect(), x = e.clientX - r.left, label = r.width < 600 ? 100 : LABEL;
	const sec = Math.max(0, (x - label) / (r.width - label - 10) * tl.end), onLane = x >= label;
	const job = state.song.job, toSec = tempoFn(job.tempo);
	let lo = 0, hi = 1; while (toSec(hi) < sec) hi *= 2; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; toSec(m) < sec ? lo = m : hi = m; }
	WLUI.menu(e, [
		onLane && { label: 'Play from here', hint: fmtTime(sec), disabled: !audio.src, run: () => { seekSongSec(sec); if (audio.paused) audio.play(); } },
		{ label: 'Open the editor here', hint: 'double-click', run: () => WLEditor.open(onLane ? lo : undefined) },
		state.pending && { label: 'Cancel render', run: cancelPreview },
		(state.soloIdx >= 0 || state.srcWindow) && { label: 'Back to the full mix', run: () => backToMix(songSecNow(), !audio.paused) },
	]);
});
$('#files').addEventListener('contextmenu', e => {
	const row = e.target.closest('.fe .p');
	if (!row) return;
	const path = row.title, gone = !state.files[path];
	WLUI.menu(e, [
		{ label: 'Open in a new tab', disabled: gone, run: () => open(fileUrl(path), '_blank') },
		{ label: 'Show in Finder', disabled: gone, run: () => reveal(state.slug, path) },
		{ label: 'Copy path', run: () => navigator.clipboard?.writeText(path) },
	]);
});

(function frame() {
	if (!audio.paused || Object.values(state.flash).some(t => Date.now() - t < 1600)) drawTimeline();
	requestAnimationFrame(frame);
})();
addEventListener('resize', () => tl && drawTimeline());
setInterval(() => { renderSongList(); renderStatus(); }, 5000);
// canvases pick up the brand fonts once they load, and the lane tones when the system theme flips
const repaint = () => { laneTone = null; if (state.song) drawTimeline(); window.WLEditor?.redraw?.(); };
document.fonts?.ready.then(repaint);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);

loadSongs().then(route);
</script>
<script src="ui/menus.js"></script>
<script src="ui/playground.js"></script>
<script src="ui/live.js"></script>
<script src="ui/editor.js"></script>
</body>
